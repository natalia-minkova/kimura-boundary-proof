name: Verify reference and external assessment
on:
  push:
    branches: [main, external-assessment-droneserver-http]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Reference suite, mutations and evidence reproduction
        run: python evaluate.py
      - name: External verdict, parsing and failure handling tests
        run: python -m unittest discover -s external_assessment/tests -v
      - name: Verify recorded external evidence
        run: |
          python -m external_assessment --verify external_assessment/examples/http-protected.json
          python -m external_assessment --verify external_assessment/examples/http-auth-disabled.json
      - name: Verify recorded paired SITL evidence (offline)
        run: |
          python -m external_assessment.sitl_negative --verify external_assessment/examples/sitl/protected --expect BOUNDARY_HELD_IN_OBSERVED_WINDOW
          python -m external_assessment.sitl_negative --verify external_assessment/examples/sitl/mutated --expect BOUNDARY_VIOLATED_IN_SCENARIO
